name: ChatDelay
version: '2.0.0'
main: skyxnetwork.chatDelay.ChatDelay
api-version: '1.21'
description: Advanced chat delay plugin with anti-spam and permission-based delays.
author: XPaladiumyX
commands:
  cooldown:
    description: Admin command to manage player chat delays
    usage: /<command> <set|reset|check|list> [player] [delay]
    permission: skyxnetwork.chatdelay.admin.setcooldown
  chatdelayreload:
    description: Reload the plugin configuration
    usage: /<command>
    permission: skyxnetwork.chatdelay.admin.reload
permissions:
  skyxnetwork.chatdelay.bypass:
    description: Bypass all chat delays
    default: op
  skyxnetwork.chatdelay.admin.setcooldown:
    description: Set or reset chat delays for players
    default: op
  skyxnetwork.chatdelay.admin.reload:
    description: Reload the plugin configuration
    default: op
  skyxnetwork.chatdelay.admin.override:
    description: Override permission-based delays
    default: op
  skyxnetwork.chatdelay.0.1:
    description: 0.1 second chat delay
    default: false
  skyxnetwork.chatdelay.0.5:
    description: 0.5 second chat delay
    default: false
  skyxnetwork.chatdelay.1.0:
    description: 1.0 second chat delay
    default: false
  skyxnetwork.chatdelay.2.0:
    description: 2.0 second chat delay
    default: false
  skyxnetwork.chatdelay.3.0:
    description: 3.0 second chat delay
    default: true