Prefix: "&dSky X &9Network &aCHAT-DELAY &8>>> &7"

default-delay: 3.0

anti-spam:
  enabled: true
  max-repeated: 2
  message-history: 5

ranks:
  default:
    delay: 3.0
  member:
    delay: 2.5
  advanced:
    delay: 2.0
  legend:
    delay: 1.5
  ultra:
    delay: 1.5
  ultime:
    delay: 1.0
  ultimeii:
    delay: 1.0
  ultimeiii:
    delay: 1.0
  god:
    delay: 0.5
  builder:
    delay: 0.5
  helper:
    delay: 0.5
  mod:
    delay: 0.3
  owner:
    delay: 0.1
  media:
    delay: 1.0
  linked:
    delay: 1.5
  vip:
    delay: 2.0
  "vip+":
    delay: 1.5
  mvp:
    delay: 1.5
  "mvp+":
    delay: 1.0

custom-permission-delay: 5.0

messages:
  cooldown: "&cYou need to wait {time} seconds before sending another message!"
  spam-detected: "&cSpam detected! Repeating the same message is not allowed."
  no-permission: "&cYou don't have permission to use this command."