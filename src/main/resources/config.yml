Prefix: "&dSky X &9Network &aCHAT-DELAY &8>>> &7"

default-delay: 3.0

anti-spam:
  enabled: true
  max-repeated: 2
  message-history: 5

ranks:
  default:
    delay: 3.0
  builder:
    delay: 0.1
  helper:
    delay: 0.1
  mod:
    delay: 0.1
  owner:
    delay: 0.1
  media:
    delay: 1.0
  vip:
    delay: 2.0
  "vip+":
    delay: 1.5
  mvp:
    delay: 1.0
  "mvp+":
    delay: 0.1

custom-permission-delay: 0.1

messages:
  cooldown: "&cYou need to wait {time} seconds before sending another message!"
  spam-detected: "&cSpam detected! Repeating the same message is not allowed."
  no-permission: "&cYou don't have permission to use this command."